name: CI

on:
  push:
    branches:
      - "**"
    paths:
      - "steem/**"
      - "steembase/**"
      - "tests/**"
      - "constraints/**"
      - "setup.py"
      - "pyproject.toml"
      - "tox.ini"
      - "requirements-test.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "steem/**"
      - "steembase/**"
      - "tests/**"
      - "constraints/**"
      - "setup.py"
      - "pyproject.toml"
      - "tox.ini"
      - "requirements-test.txt"
      - ".github/workflows/ci.yml"

jobs:
  tests:
    env:
      PIP_CONSTRAINT: constraints/toolchain.txt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned tooling
        run: |
          python -m pip install --upgrade -c constraints/toolchain.txt pip
          python -m pip install -c constraints/toolchain.txt setuptools wheel build twine tox

      - name: Run tests via tox
        run: tox -e py${{ matrix.python-version }}

  lint:
    env:
      PIP_CONSTRAINT: constraints/toolchain.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned tooling
        run: |
          python -m pip install --upgrade -c constraints/toolchain.txt pip
          python -m pip install -c constraints/toolchain.txt setuptools wheel build twine tox

      - name: Run lint checks
        run: tox -e lint
