name: CI

on:
  push:
    branches:
      - "**"
    paths:
      - "steem/**"
      - "steembase/**"
      - "tests/**"
      - "constraints/**"
      - "setup.py"
      - "pyproject.toml"
      - "tox.ini"
      - "requirements-test.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "steem/**"
      - "steembase/**"
      - "tests/**"
      - "constraints/**"
      - "setup.py"
      - "pyproject.toml"
      - "tox.ini"
      - "requirements-test.txt"
      - ".github/workflows/ci.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            toxenv: py38
          - python-version: "3.9"
            toxenv: py39
          - python-version: "3.10"
            toxenv: py310
          - python-version: "3.11"
            toxenv: py311
          - python-version: "3.12"
            toxenv: py312

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned tooling
        run: |
          python -m pip install --upgrade -c constraints/toolchain.txt pip
          python -m pip install -c constraints/toolchain.txt setuptools wheel build twine tox

      - name: Run tests via tox
        run: tox -e ${{ matrix.toxenv }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned tooling
        run: |
          python -m pip install --upgrade -c constraints/toolchain.txt pip
          python -m pip install -c constraints/toolchain.txt setuptools wheel build twine tox

      - name: Run lint checks
        run: tox -e lint
