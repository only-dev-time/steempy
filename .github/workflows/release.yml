name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: |
          python -m pip install --upgrade -c constraints/toolchain.txt pip
          python -m pip install -c constraints/toolchain.txt setuptools wheel build twine

      - name: Build wheel and validate metadata
        run: |
          python -m build --no-isolation --wheel --outdir dist-matrix
          python -m twine check dist-matrix/*

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tox
        run: |
          python -m pip install --upgrade -c constraints/toolchain.txt pip
          python -m pip install -c constraints/toolchain.txt setuptools wheel build twine tox

      - name: Build and validate artifacts
        run: tox -e package

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/*

  tox-install-matrix:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toxenv: install-py38
            python-version: "3.8"
          - toxenv: install-py39
            python-version: "3.9"
          - toxenv: install-py310
            python-version: "3.10"
          - toxenv: install-py311
            python-version: "3.11"
          - toxenv: install-py312
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist

      - name: Install tox and validate wheel installation with tox
        run: |
          python -m pip install --upgrade -c constraints/toolchain.txt pip
          python -m pip install -c constraints/toolchain.txt setuptools wheel build twine tox
          tox -e ${{ matrix.toxenv }}

  publish-testpypi:
    needs: [build-matrix, tox-install-matrix]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

  publish-pypi:
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: publish-testpypi
    environment:
      name: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
