[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py38"
line-length = 120
exclude = [
  ".git",
  ".tox",
  "build",
  "dist",
  "venv*",
]

[tool.ruff.format]
# preserve existing quote style instead of forcing double quotes,
# to minimize the diff against the previously yapf-formatted code
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F"]
extend-select = ["W", "B", "C4", "PERF", "A", "N", "RUF"]
ignore = [
    "F401",
    "F403",
    "F405",
]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.pydocstyle]
# closest match to the existing Sphinx-style (:param x:) docstrings;
# only relevant once "D" is added to select/extend-select
# should be activated when working on the documentation
convention = "pep257"

[tool.isort]
py_version = 38
line_length = 120
skip_gitignore = true
lines_after_imports = 2
force_single_line = true
include_trailing_comma = true
atomic = true
honor_noqa = true
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER"
]
default_section = "THIRDPARTY"
known_first_party = ["steem", "steembase"]

[tool.mypy]
# Platform configuration
python_version = "3.8"
# imports related
ignore_missing_imports = true
follow_imports = "silent"
# None and Optional handling
no_implicit_optional = false
strict_optional = true  # should not be ignored
# Configuring warnings
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = false
warn_return_any = false
# Untyped definitions and calls
check_untyped_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
# Disallow dynamic typing
disallow_subclassing_any = false
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false
# Miscellaneous strictness flags
allow_untyped_globals = true
allow_redefinition = false
local_partial_types = false
implicit_reexport = true
strict_equality = true
# Configuring error messages
show_error_context = true
show_column_numbers = true
show_error_codes = true
# misc
pretty = true
disable_error_code = ["union-attr", "var-annotated", "arg-type", "assignment", "index", "operator", "misc"]

[tool.pytest.ini_options]
norecursedirs = ["dist", "docs", "build", "deploy"]
addopts = "-ra"
testpaths = ["tests"]
