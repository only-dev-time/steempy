[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py38"
line-length = 120
exclude = [
  ".git",
  ".tox",
  "build",
  "dist",
  "venv*",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = [
  "E111",
  "E114",
  "E711",
  "E721",
  "W605",
  "F401",
  "F403",
  "F405",
  "F821",
  "F632",
]

[tool.isort]
py_version = 38
line_length = 120
skip_gitignore = true
lines_after_imports = 2
force_single_line = true
include_trailing_comma = true
known_first_party = ["steem", "steembase"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
pretty = true
check_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false
disable_error_code = ["attr-defined", "name-defined", "call-arg", "arg-type", "assignment", "index", "operator", "misc"]
exclude = "^(build|dist|\\.tox|venv.*)/"

[tool.pytest.ini_options]
norecursedirs = ["dist", "docs", "build", "deploy"]
addopts = "-ra"
testpaths = ["tests"]
