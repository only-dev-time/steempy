[tox]
min_version = 4.6
env_list = py38, py39, py310, py311, py312, lint, mypy-py38, mypy-py39, mypy-py310, mypy-py311, mypy-py312, package, build-py38, build-py39, build-py310, build-py311, build-py312, install-py38, install-py39, install-py310, install-py311, install-py312
skip_missing_interpreters = true

[testenv]
description = Run tests for a specific Python version
deps = -r requirements-test.txt
package = wheel
setenv =
    PIP_CONSTRAINT = {toxinidir}/constraints/toolchain.txt
commands =
    pytest tests

[testenv:lint]
description = Run style checks
base_python = python3.12
deps = -r requirements-test.txt
skip_install = true
commands =
    ruff check steem steembase tests setup.py
    ruff format --check steem steembase tests setup.py
    isort --check-only setup.py steem steembase tests
    mypy steem steembase tests setup.py

[testenv:mypy-py{38,39,310,311,312}]
description = Run mypy against a specific Python version interpreter and installed dependencies
deps = -r requirements-test.txt
setenv =
    PIP_CONSTRAINT = {toxinidir}/constraints/toolchain.txt
skip_install = true
commands =
    py38: mypy --python-version 3.8 steem steembase tests setup.py
    py39: mypy --python-version 3.9 steem steembase tests setup.py
    py310: mypy --python-version 3.10 steem steembase tests setup.py
    py311: mypy --python-version 3.11 steem steembase tests setup.py
    py312: mypy --python-version 3.12 steem steembase tests setup.py

[testenv:package]
description = Build sdist and wheel, then validate metadata
base_python = python3.12
deps = -r requirements-build.txt
skip_install = true
commands =
    python -m pip install --upgrade pip
    python -m build --no-isolation --sdist --wheel --outdir {toxinidir}/dist
    python -m twine check {toxinidir}/dist/*

[testenv:build-py38]
description = Build wheel on Python 3.8 and validate metadata
base_python = python3.8
deps = -r requirements-build.txt
skip_install = true
commands =
    python -m pip install --upgrade pip
    python -m build --no-isolation --wheel --outdir {toxinidir}/dist-matrix/py38
    python -m twine check {toxinidir}/dist-matrix/py38/*

