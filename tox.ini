[tox]
min_version = 4.6
env_list = py38, py39, py310, py311, py312, lint, package, install-py38, install-py39, install-py310, install-py311, install-py312
skip_missing_interpreters = true

[testenv]
description = Run tests for a specific Python version
deps = -r requirements-test.txt
package = wheel
commands =
    pytest tests

[testenv:lint]
description = Run style checks
base_python = python3.12
deps = -r requirements-test.txt
skip_install = true
commands =
    ruff check steem steembase tests setup.py
    isort --check-only setup.py steem/__init__.py steembase/__init__.py tests/__init__.py
    mypy tests/__init__.py

[testenv:package]
description = Build sdist and wheel, then validate metadata
base_python = python3.12
deps = -r requirements-build.txt
skip_install = true
commands =
    python -m build --sdist --wheel --outdir {toxinidir}/dist
    python -m twine check {toxinidir}/dist/*

[testenv:install-py38]
description = Install built wheel on Python 3.8 and run smoke checks
base_python = python3.8
deps = -r requirements-build.txt
skip_install = true
commands =
    python -m pip install --upgrade pip
    python -m build --wheel --outdir {toxinidir}/dist
    python -c "import glob, subprocess, sys; wheels = sorted(glob.glob(r'{toxinidir}/dist/*.whl')); assert wheels, 'No wheel found in dist/'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[-1]])"
    python -c "import steem, steembase; print(steem.__version__)"
    steempy --version

