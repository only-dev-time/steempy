[testenv:install-py38]
description = Install prebuilt wheel on Python 3.8 and run smoke checks
base_python = python3.8
deps =
skip_install = true
commands =
    python -m pip install --upgrade pip
    python -m pip install setuptools
    python -c "import glob, subprocess, sys; wheels = sorted(glob.glob(r'{toxinidir}/dist/*.whl')); assert wheels, 'No prebuilt wheel found in dist/ (run tox -e package first)'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[-1]])"
    python -c "import steem, steembase; print(steem.__version__)"
    steempy --version

